<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Workshop agent evaluation architecture</title>
  <desc id="desc">A single evaluation scenario runs against local workerd or an Access preview, drives the production Workshop agent through Cap'n Web, verifies the generated Gadget through RPC, and reports through vitest-evals. A second panel shows the ownership boundary.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#111827" flood-opacity="0.09"/>
    </filter>
    <linearGradient id="scenario-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6821F"/>
      <stop offset="1" stop-color="#F4B41A"/>
    </linearGradient>
    <linearGradient id="result-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16A34A"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; letter-spacing: -1.2px; }
      .subtitle { font: 400 19px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6B7280; }
      .eyebrow { font: 700 13px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #C9580A; letter-spacing: 1.8px; }
      .card-title { font: 700 21px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .card-copy { font: 400 15px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6B7280; }
      .small-title { font: 700 17px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small-copy { font: 400 13px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6B7280; }
      .badge { font: 700 11px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; }
      .flow { fill: none; stroke: #9CA3AF; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .flow-soft { fill: none; stroke: #D1D5DB; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#F7F7F5"/>
  <circle cx="1505" cy="66" r="130" fill="#FFF2E8"/>
  <circle cx="90" cy="930" r="150" fill="#EEF5FF"/>

  <text class="title" x="56" y="62">Workshop agent evals</text>
  <text class="subtitle" x="56" y="94">One scenario definition exercises the production path locally or on a deployed preview.</text>

  <g filter="url(#shadow)">
    <rect x="40" y="126" width="1520" height="454" rx="28" fill="#FFFFFF"/>
  </g>
  <text class="eyebrow" x="76" y="168">RUN PATH</text>
  <text class="card-copy" x="76" y="196">The target changes. The prompt, agent lifecycle, verifier, and report stay the same.</text>

  <g filter="url(#card-shadow)">
    <rect x="76" y="258" width="230" height="132" rx="18" fill="#FFFFFF" stroke="#FBCFA9" stroke-width="1.5"/>
    <rect x="76" y="258" width="230" height="6" rx="3" fill="url(#scenario-accent)"/>
  </g>
  <rect x="96" y="282" width="66" height="24" rx="12" fill="#FFF2E8"/>
  <text class="badge" x="111" y="298" fill="#C9580A">INPUT</text>
  <text class="card-title" x="96" y="334">Eval scenario</text>
  <text class="card-copy" x="96" y="359">Prompt + RPC verifier</text>
  <text class="small-copy" x="96" y="380">Identical on every target</text>

  <path class="flow-soft" d="M 306 324 H 350"/>
  <path class="flow-soft" d="M 350 249 V 399"/>
  <path class="flow" d="M 350 249 H 386"/>
  <path class="flow" d="M 350 399 H 386"/>

  <g filter="url(#card-shadow)">
    <rect x="388" y="208" width="214" height="86" rx="16" fill="#F7FAFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect x="388" y="358" width="214" height="86" rx="16" fill="#FAF7FF" stroke="#DDD6FE" stroke-width="1.5"/>
  </g>
  <circle cx="415" cy="235" r="10" fill="#3B82F6"/>
  <text class="small-title" x="437" y="241">Local workerd</text>
  <text class="small-copy" x="415" y="270">Fast runs and fault injection</text>
  <circle cx="415" cy="385" r="10" fill="#7C3AED"/>
  <text class="small-title" x="437" y="391">Access preview</text>
  <text class="small-copy" x="415" y="420">Deployed functional E2E</text>

  <path class="flow-soft" d="M 602 251 H 638 V 324"/>
  <path class="flow-soft" d="M 602 401 H 638 V 324"/>
  <path class="flow" d="M 638 324 H 680"/>

  <g filter="url(#card-shadow)">
    <rect x="682" y="258" width="226" height="132" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  </g>
  <rect x="702" y="282" width="92" height="24" rx="12" fill="#F3F4F6"/>
  <text class="badge" x="716" y="298" fill="#4B5563">SESSION</text>
  <text class="card-title" x="702" y="334">AgentSession</text>
  <text class="card-copy" x="702" y="359">Cap'n Web lifecycle</text>
  <text class="small-copy" x="702" y="380">Workspace, chat, cleanup</text>

  <path class="flow" d="M 908 324 H 954"/>

  <g filter="url(#card-shadow)">
    <rect x="956" y="258" width="214" height="132" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  </g>
  <rect x="976" y="282" width="72" height="24" rx="12" fill="#FFF2E8"/>
  <text class="badge" x="991" y="298" fill="#C9580A">AGENT</text>
  <text class="card-title" x="976" y="334">Workshop agent</text>
  <text class="card-copy" x="976" y="359">Production tools and loop</text>
  <text class="small-copy" x="976" y="380">Builds the requested app</text>

  <path class="flow" d="M 1170 324 H 1216"/>

  <g filter="url(#card-shadow)">
    <rect x="1218" y="236" width="266" height="176" rx="20" fill="#F7FFF9" stroke="#BBF7D0" stroke-width="1.5"/>
    <rect x="1218" y="236" width="266" height="6" rx="3" fill="url(#result-accent)"/>
  </g>
  <rect x="1238" y="262" width="74" height="24" rx="12" fill="#DCFCE7"/>
  <text class="badge" x="1253" y="278" fill="#15803D">OUTPUT</text>
  <text class="card-title" x="1238" y="316">Generated Gadget</text>
  <text class="card-copy" x="1238" y="343">Behavior checked through RPC</text>
  <line x1="1238" y1="362" x2="1464" y2="362" stroke="#D1FAE5" stroke-width="1.5"/>
  <text class="small-copy" x="1238" y="387">Scores · traces · timings · errors</text>

  <rect x="76" y="482" width="1408" height="54" rx="14" fill="#FAFAF9" stroke="#ECECE9"/>
  <circle cx="102" cy="509" r="8" fill="#16A34A"/>
  <text class="small-title" x="122" y="515">Functional result first</text>
  <text class="card-copy" x="306" y="515">Tool calls, time, tokens, and errors explain the result without replacing it.</text>

  <g filter="url(#shadow)">
    <rect x="40" y="614" width="1520" height="314" rx="28" fill="#FFFFFF"/>
  </g>
  <text class="eyebrow" x="76" y="656">OWNERSHIP BOUNDARY</text>
  <text class="card-copy" x="76" y="684">Cloudflare OS owns product behavior. The evaluation framework owns reusable mechanics.</text>

  <rect x="76" y="714" width="952" height="166" rx="22" fill="#FFF9F4" stroke="#FDE0C8"/>
  <rect x="1052" y="714" width="472" height="166" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="96" y="730" width="104" height="24" rx="12" fill="#FFF2E8"/>
  <text class="badge" x="112" y="746" fill="#C9580A">REPOSITORY</text>
  <rect x="1072" y="730" width="106" height="24" rx="12" fill="#EEF2FF"/>
  <text class="badge" x="1088" y="746" fill="#4F46E5">FRAMEWORK</text>

  <g filter="url(#card-shadow)">
    <rect x="108" y="774" width="350" height="78" rx="16" fill="#FFFFFF" stroke="#FBCFA9"/>
    <rect x="590" y="774" width="390" height="78" rx="16" fill="#FFFFFF" stroke="#FBCFA9"/>
    <rect x="1084" y="774" width="408" height="78" rx="16" fill="#FFFFFF" stroke="#C7D2FE"/>
  </g>
  <text class="small-title" x="132" y="807">integration-tests</text>
  <text class="small-copy" x="132" y="831">workerd · Cap'n Web · session lifecycle</text>
  <text class="small-title" x="614" y="807">workshop-evals</text>
  <text class="small-copy" x="614" y="831">targets · scenarios · RPC verification</text>
  <text class="small-title" x="1108" y="807">vitest-evals</text>
  <text class="small-copy" x="1108" y="831">runner · events · reports · shard reduction</text>

  <path class="flow" d="M 590 813 H 480"/>
  <path class="flow" d="M 980 813 H 1062"/>

  <text class="small-copy" x="56" y="958">Manual locally or through workflow_dispatch · one task definition for every target</text>
  <g transform="translate(1501 941)">
    <path d="M0 8.5 8 4l8 4.5v9L8 22l-8-4.5z" fill="none" stroke="#F6821F" stroke-width="2" transform="translate(-8 -13) scale(.75)"/>
  </g>
</svg>
