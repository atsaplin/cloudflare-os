<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">What Workshop agent evals measure and how they report results</title><desc id="desc">Behavioral checks produce the score, while timing, tool, error, token, cost, and target data remain diagnostics. Canonical history and RPC evidence become a normalized vitest-evals result that feeds a local report, a combined GitHub report, or an optional experiment store.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#111827" flood-opacity="0.08"/></filter><filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#111827" flood-opacity="0.09"/></filter><linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16A34A"/><stop offset="1" stop-color="#22C55E"/></linearGradient><linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F6821F"/><stop offset="1" stop-color="#F4B41A"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9CA3AF"/></marker><style>.title{font:700 42px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827;letter-spacing:-1.2px}.subtitle{font:400 20px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6B7280}.eyebrow{font:700 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#C9580A;letter-spacing:1.8px}.card-title{font:700 21px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.card-copy{font:400 15px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6B7280}.metric-title{font:700 17px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.metric-copy{font:400 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6B7280}.badge{font:700 11px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.flow{fill:none;stroke:#9CA3AF;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style></defs><rect width="1600" height="900" fill="#F7F7F5"/><circle cx="1510" cy="66" r="130" fill="#FFF2E8"/><circle cx="60" cy="875" r="140" fill="#EEF5FF"/><text class="title" x="56" y="62">What the eval records</text><text class="subtitle" x="56" y="94">Outcome decides the score. Diagnostics explain why the run behaved that way.</text><g filter="url(#shadow)"><rect x="40" y="126" width="1520" height="348" rx="28" fill="#FFFFFF"/></g><text class="eyebrow" x="76" y="168">ONE TRIAL</text><g filter="url(#card-shadow)"><rect x="76" y="196" width="450" height="230" rx="20" fill="#F7FFF9" stroke="#BBF7D0" stroke-width="1.5"/><rect x="76" y="196" width="450" height="6" rx="3" fill="url(#green)"/></g><rect x="98" y="222" width="82" height="24" rx="12" fill="#DCFCE7"/><text class="badge" x="113" y="238" fill="#15803D">SCORED</text><text class="card-title" x="98" y="280">Behavioral outcome</text><text class="card-copy" x="98" y="306">Deterministic checks through stable product interfaces</text><circle cx="108" cy="338" r="6" fill="#16A34A"/><text class="metric-title" x="126" y="344">Requirement pass fraction</text><circle cx="108" cy="370" r="6" fill="#16A34A"/><text class="metric-title" x="126" y="376">RPC invariants and concurrency</text><circle cx="108" cy="402" r="6" fill="#16A34A"/><text class="metric-title" x="126" y="408">State and standard output contracts</text><g filter="url(#card-shadow)"><rect x="556" y="196" width="948" height="230" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><rect x="556" y="196" width="948" height="6" rx="3" fill="url(#orange)"/></g><rect x="578" y="222" width="118" height="24" rx="12" fill="#FFF2E8"/><text class="badge" x="594" y="238" fill="#C9580A">DIAGNOSTIC</text><text class="card-title" x="578" y="280">Run context</text><text class="card-copy" x="715" y="280">Recorded beside the score, never blended into it</text><g><rect x="578" y="308" width="278" height="44" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/><circle cx="601" cy="330" r="8" fill="#3B82F6"/><text class="metric-title" x="619" y="336">Wall + per-turn time</text><rect x="878" y="308" width="278" height="44" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/><circle cx="901" cy="330" r="8" fill="#7C3AED"/><text class="metric-title" x="919" y="336">Model turns</text><rect x="1178" y="308" width="300" height="44" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/><circle cx="1201" cy="330" r="8" fill="#F6821F"/><text class="metric-title" x="1219" y="336">Tool calls + failures</text><rect x="578" y="368" width="278" height="44" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/><circle cx="601" cy="390" r="8" fill="#DC2626"/><text class="metric-title" x="619" y="396">Agent/provider errors</text><rect x="878" y="368" width="278" height="44" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/><circle cx="901" cy="390" r="8" fill="#16A34A"/><text class="metric-title" x="919" y="396">Tokens + cost</text><rect x="1178" y="368" width="300" height="44" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/><circle cx="1201" cy="390" r="8" fill="#64748B"/><text class="metric-title" x="1219" y="396">Model + target + trial</text></g><g filter="url(#shadow)"><rect x="40" y="502" width="1520" height="338" rx="28" fill="#FFFFFF"/></g><text class="eyebrow" x="76" y="544">REPORTING PATH</text><text class="card-copy" x="270" y="544">One normalized result feeds every view.</text><g filter="url(#card-shadow)"><rect x="76" y="590" width="290" height="132" rx="18" fill="#FFFFFF" stroke="#FBCFA9" stroke-width="1.5"/><rect x="438" y="590" width="310" height="132" rx="18" fill="#FFF9F4" stroke="#FBCFA9" stroke-width="1.5"/><rect x="850" y="562" width="280" height="92" rx="16" fill="#F7FAFF" stroke="#BFDBFE" stroke-width="1.5"/><rect x="850" y="672" width="280" height="92" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="1218" y="617" width="288" height="92" rx="16" fill="#FAF7FF" stroke="#DDD6FE" stroke-width="1.5"/></g><rect x="98" y="614" width="92" height="24" rx="12" fill="#FFF2E8"/><text class="badge" x="114" y="630" fill="#C9580A">EVIDENCE</text><text class="card-title" x="98" y="670">Canonical run</text><text class="card-copy" x="98" y="696">History · RPC checks · usage</text><path class="flow" d="M366 656H436"/><rect x="460" y="614" width="106" height="24" rx="12" fill="#FFF2E8"/><text class="badge" x="476" y="630" fill="#C9580A">NORMALIZED</text><text class="card-title" x="460" y="670">vitest-evals result</text><text class="card-copy" x="460" y="696">Events · scores · metadata</text><path d="M748 656H798V608H848M798 656V718H848" fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text class="metric-title" x="874" y="600">Local report UI</text><text class="metric-copy" x="874" y="626">Inspect transcripts and failures</text><text class="metric-title" x="874" y="710">GitHub combined report</text><text class="metric-copy" x="874" y="736">Merge shards and gate runs</text><path d="M1130 608H1174V663H1216M1130 718H1174V663" fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1240" y="640" width="72" height="22" rx="11" fill="#EDE9FE"/><text class="badge" x="1254" y="655" fill="#6D28D9">OPTIONAL</text><text class="metric-title" x="1240" y="685">Experiment store</text><text class="metric-copy" x="1240" y="706">Long-term comparisons</text><rect x="76" y="780" width="1430" height="36" rx="12" fill="#FAFAF9"/><text class="metric-copy" x="98" y="804">A tool error stays visible even when the agent recovers. Platform and provider failures never become model scores.</text><text class="metric-copy" x="56" y="875">Compare models with the agent implementation fixed. Compare agent changes with the model fixed.</text></svg>
