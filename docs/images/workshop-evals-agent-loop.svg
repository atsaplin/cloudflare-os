<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">The production agent loop inside one evaluation trial</title><desc id="desc">A natural-language task enters the production Workshop agent loop. The agent plans, reads context and skills, calls tools, inspects results, and recovers until the workspace settles. The evaluation then verifies the generated Gadget through RPC and preserves the canonical transcript.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#111827" flood-opacity="0.08"/></filter><filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#111827" flood-opacity="0.09"/></filter><linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F6821F"/><stop offset="1" stop-color="#F4B41A"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16A34A"/><stop offset="1" stop-color="#22C55E"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9CA3AF"/></marker><style>.title{font:700 42px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827;letter-spacing:-1.2px}.subtitle{font:400 20px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6B7280}.eyebrow{font:700 13px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#C9580A;letter-spacing:1.8px}.card-title{font:700 22px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.card-copy{font:400 16px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6B7280}.orbit-title{font:700 18px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.orbit-copy{font:400 14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6B7280}.badge{font:700 11px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}.flow{fill:none;stroke:#9CA3AF;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.loop{fill:none;stroke:#F6A15C;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style></defs><rect width="1600" height="800" fill="#F7F7F5"/><circle cx="1505" cy="66" r="130" fill="#FFF2E8"/><circle cx="70" cy="770" r="130" fill="#EEF5FF"/><text class="title" x="56" y="62">Inside one eval trial</text><text class="subtitle" x="56" y="94">The production agent keeps working until the workspace settles or the turn reaches its deadline.</text><g filter="url(#shadow)"><rect x="40" y="126" width="1520" height="608" rx="28" fill="#FFFFFF"/></g><text class="eyebrow" x="76" y="168">PRODUCTION LOOP</text><g filter="url(#card-shadow)"><rect x="74" y="292" width="228" height="148" rx="18" fill="#FFFFFF" stroke="#FBCFA9" stroke-width="1.5"/><rect x="74" y="292" width="228" height="6" rx="3" fill="url(#orange)"/></g><rect x="96" y="318" width="64" height="24" rx="12" fill="#FFF2E8"/><text class="badge" x="112" y="334" fill="#C9580A">TASK</text><text class="card-title" x="96" y="372">User request</text><text class="card-copy" x="96" y="399">Natural-language requirements</text><text class="card-copy" x="96" y="422">for a real Gadget</text><path class="flow" d="M302 366H354"/><rect x="356" y="190" width="778" height="400" rx="28" fill="#FFF9F4" stroke="#FDE0C8" stroke-width="1.5"/><rect x="378" y="210" width="112" height="24" rx="12" fill="#FFF2E8"/><text class="badge" x="394" y="226" fill="#C9580A">ONE TURN</text><g filter="url(#card-shadow)"><rect x="640" y="330" width="238" height="122" rx="20" fill="#FFFFFF" stroke="#FBCFA9" stroke-width="1.5"/><rect x="640" y="330" width="238" height="6" rx="3" fill="url(#orange)"/></g><text class="card-title" x="674" y="376">Workshop agent</text><text class="card-copy" x="674" y="404">Production prompt, tools,</text><text class="card-copy" x="674" y="427">bindings, and compaction</text><g filter="url(#card-shadow)"><rect x="602" y="226" width="314" height="78" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="392" y="344" width="208" height="92" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="918" y="344" width="190" height="92" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="596" y="476" width="326" height="82" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/></g><circle cx="630" cy="253" r="10" fill="#3B82F6"/><text class="orbit-title" x="652" y="258">Read context and skills</text><text class="orbit-copy" x="630" y="282">Catalog, observations, current workspace</text><circle cx="420" cy="374" r="10" fill="#7C3AED"/><text class="orbit-title" x="442" y="380">Plan</text><text class="orbit-copy" x="420" y="406">Choose the next useful step</text><circle cx="946" cy="374" r="10" fill="#F6821F"/><text class="orbit-title" x="968" y="380">Call tools</text><text class="orbit-copy" x="946" y="406">Create · edit · execute</text><circle cx="624" cy="505" r="10" fill="#16A34A"/><text class="orbit-title" x="646" y="511">Inspect, recover, continue</text><text class="orbit-copy" x="624" y="536">Use results and errors as the next input</text><path class="loop" d="M596 360C532 302 548 250 602 250"/><path class="loop" d="M916 264C984 276 1015 306 1015 344"/><path class="loop" d="M1015 436C1004 486 972 517 922 517"/><path class="loop" d="M596 517C520 504 482 474 480 436"/><path d="M759 304V330M759 452V476M600 390H640M878 390H918" stroke="#E5A46E" stroke-width="2" stroke-dasharray="5 6"/><path class="flow" d="M1134 390H1184"/><g filter="url(#card-shadow)"><rect x="1186" y="246" width="314" height="136" rx="18" fill="#F7FAFF" stroke="#BFDBFE" stroke-width="1.5"/><rect x="1186" y="416" width="314" height="136" rx="18" fill="#F7FFF9" stroke="#BBF7D0" stroke-width="1.5"/></g><rect x="1208" y="270" width="86" height="24" rx="12" fill="#DBEAFE"/><text class="badge" x="1223" y="286" fill="#1D4ED8">SETTLED</text><text class="card-title" x="1208" y="326">Workspace state</text><text class="card-copy" x="1208" y="353">Canonical history + workpieces</text><path class="flow" d="M1343 382V414"/><rect x="1208" y="440" width="88" height="24" rx="12" fill="#DCFCE7"/><text class="badge" x="1224" y="456" fill="#15803D">CHECKED</text><text class="card-title" x="1208" y="496">Gadget RPC verifier</text><text class="card-copy" x="1208" y="523">Observable behavior, not trajectory</text><rect x="76" y="632" width="1424" height="58" rx="14" fill="#FAFAF9" stroke="#ECECE9"/><circle cx="104" cy="661" r="8" fill="#F6821F"/><text class="orbit-title" x="124" y="667">Nothing is reconstructed later</text><text class="card-copy" x="460" y="667">Messages, tool calls, tool errors, timings, and usage come from the canonical run.</text><text class="orbit-copy" x="56" y="775">A recovered tool failure can still produce a passing Gadget. An incorrect Gadget cannot.</text></svg>
