name: Workshop evals

on:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated Workshop model IDs
        default: "@cf/zai-org/glm-5.2,@cf/moonshotai/kimi-k2.7-code"
        required: true
      trials:
        description: Repetitions per task and model
        default: "3"
        required: true

permissions:
  contents: read

jobs:
  evals:
    name: shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: "24.19.0"
          cache: true
          run-install: true

      - name: Build
        run: pnpm build

      - name: Run eval shard
        id: run
        continue-on-error: true
        working-directory: packages/workshop-evals
        env:
          CF_AI_GATEWAY: ${{ secrets.CF_AI_GATEWAY_NAME }}
          CF_AI_GATEWAY_ACCOUNT_ID: ${{ secrets.CF_AI_GATEWAY_ACCOUNT_ID }}
          CF_AI_GATEWAY_API_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          WORKSHOP_EVAL_MODELS: ${{ inputs.models }}
          WORKSHOP_EVAL_TRIALS: ${{ inputs.trials }}
        run: |
          pnpm exec vitest run --config vitest.eval.config.ts \
            --shard=${{ matrix.shard }}/3 \
            --reporter=vitest-evals/reporter \
            --reporter=json \
            --outputFile.json=.wrangler/evals/results-${{ matrix.shard }}.json

      - name: Require eval results
        run: test -f packages/workshop-evals/.wrangler/evals/results-${{ matrix.shard }}.json

      - name: Upload eval results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workshop-evals-${{ matrix.shard }}
          path: packages/workshop-evals/.wrangler/evals/results-${{ matrix.shard }}.json
          retention-days: 30

  report:
    name: report
    if: always()
    needs: evals
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Download eval results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: workshop-evals-*
          path: eval-results
          merge-multiple: true

      - name: Publish combined eval report
        uses: getsentry/vitest-evals@d37153f06d7d086393927c57a2faaeff464a55e2 # v0
        with:
          results: eval-results/*.json
          publish-check: true
          check-name: Workshop evals
          fail-on-failures: true
